<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" role="img" aria-labelledby="t d">
  <title id="t">KAPE and THOR Lite triage workflow</title>
  <desc id="d">Five steps: collect with KAPE targets into a VHDX, hash and log, parse with KAPE modules, scan a mounted copy with THOR Lite, then correlate THOR hits against the parsed timeline.</desc>
  <!-- Author: Ahmad Shaukat -->
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; fill: #18202b; }
    .n { font-size: 14px; font-weight: 700; fill: #ffffff; }
    .h { font-size: 15px; font-weight: 700; }
    .s { font-size: 13px; fill: #4a5462; }
    .box { fill: #ffffff; stroke: #b9c1c9; stroke-width: 1.5; }
    .key { fill: #e3ede9; stroke: #1f5a4e; stroke-width: 1.5; }
    .dot { fill: #1f5a4e; }
    .arrow { stroke: #18202b; stroke-width: 1.5; fill: none; marker-end: url(#a); }
    .side { font-size: 12px; fill: #4a5462; font-style: italic; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#18202b"/>
    </marker>
  </defs>
  <rect width="640" height="560" fill="#ffffff"/>

  <g>
    <rect class="box" x="24" y="20" width="592" height="80" rx="4"/>
    <circle class="dot" cx="56" cy="60" r="16"/><text class="n" x="56" y="65" text-anchor="middle">1</text>
    <text class="h" x="88" y="52">Collect: KAPE targets</text>
    <text class="s" x="88" y="76">KapeTriage target from the live host or a mounted image into a VHDX container</text>
  </g>
  <path class="arrow" d="M56,100 L56,124"/>
  <g>
    <rect class="box" x="24" y="126" width="592" height="80" rx="4"/>
    <circle class="dot" cx="56" cy="166" r="16"/><text class="n" x="56" y="171" text-anchor="middle">2</text>
    <text class="h" x="88" y="158">Preserve: hash and log</text>
    <text class="s" x="88" y="182">SHA-256 of the container, KAPE copy log kept with the case notes</text>
  </g>
  <path class="arrow" d="M56,206 L56,230"/>
  <g>
    <rect class="box" x="24" y="232" width="592" height="80" rx="4"/>
    <circle class="dot" cx="56" cy="272" r="16"/><text class="n" x="56" y="277" text-anchor="middle">3</text>
    <text class="h" x="88" y="264">Parse: KAPE modules</text>
    <text class="s" x="88" y="288">!EZParser over a working copy: MFT, prefetch, Amcache, registry, event logs to CSV</text>
  </g>
  <path class="arrow" d="M56,312 L56,336"/>
  <g>
    <rect class="box" x="24" y="338" width="592" height="80" rx="4"/>
    <circle class="dot" cx="56" cy="378" r="16"/><text class="n" x="56" y="383" text-anchor="middle">4</text>
    <text class="h" x="88" y="370">Scan: THOR Lite</text>
    <text class="s" x="88" y="394">Full disk image mounted read-only, or the live host after collection</text>
  </g>
  <path class="arrow" d="M56,418 L56,442"/>
  <g>
    <rect class="key" x="24" y="444" width="592" height="92" rx="4"/>
    <circle class="dot" cx="56" cy="490" r="16"/><text class="n" x="56" y="495" text-anchor="middle">5</text>
    <text class="h" x="88" y="476">Correlate</text>
    <text class="s" x="88" y="500">Each THOR hit is checked against execution and file-system evidence</text>
    <text class="s" x="88" y="520">from step 3 before it becomes a finding</text>
  </g>
</svg>
