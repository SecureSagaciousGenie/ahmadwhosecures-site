<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="t d">
  <title id="t">Gmail labels migrated as folders versus as categories</title>
  <desc id="d">One Gmail message with three labels becomes three copies when labels migrate as folders, and one copy with three categories when labels migrate as categories.</desc>
  <!-- Author: Ahmad Shaukat -->
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; fill: #18202b; }
    .h { font-size: 15px; font-weight: 700; }
    .s { font-size: 13px; fill: #4a5462; }
    .lbl { font-size: 12px; font-weight: 600; fill: #1f5a4e; }
    .box { fill: #ffffff; stroke: #b9c1c9; stroke-width: 1.5; }
    .msg { fill: #e3ede9; stroke: #1f5a4e; stroke-width: 1.5; }
    .tag { fill: #ffffff; stroke: #1f5a4e; stroke-width: 1.2; }
    .folder { fill: #f7f8f6; stroke: #4a5462; stroke-width: 1.2; }
    .arrow { stroke: #18202b; stroke-width: 1.5; fill: none; marker-end: url(#a); }
    .count { font-size: 14px; font-weight: 700; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#18202b"/>
    </marker>
  </defs>
  <rect width="720" height="380" fill="#ffffff"/>

  <!-- Source -->
  <text class="h" x="24" y="36">Gmail: one message, three labels</text>
  <rect class="box" x="24" y="56" width="220" height="150" rx="4"/>
  <rect class="msg" x="44" y="76" width="180" height="44" rx="3"/>
  <text x="58" y="103" font-size="13">Message: RFQ reply</text>
  <rect class="tag" x="44" y="134" width="56" height="24" rx="12"/><text class="lbl" x="56" y="151">Bids</text>
  <rect class="tag" x="106" y="134" width="44" height="24" rx="12"/><text class="lbl" x="117" y="151">Q3</text>
  <rect class="tag" x="156" y="134" width="70" height="24" rx="12"/><text class="lbl" x="166" y="151">Follow up</text>
  <text class="s" x="44" y="184">Stored once. Size counted once.</text>

  <path class="arrow" d="M250,110 C300,110 300,80 340,80"/>
  <path class="arrow" d="M250,160 C300,160 300,270 340,270"/>

  <!-- Folders -->
  <text class="h" x="350" y="36">Labels as folders (default)</text>
  <g>
    <rect class="folder" x="350" y="56" width="104" height="74" rx="3"/>
    <text class="s" x="362" y="76">Bids</text>
    <rect class="msg" x="362" y="88" width="80" height="28" rx="3"/>
    <rect class="folder" x="462" y="56" width="104" height="74" rx="3"/>
    <text class="s" x="474" y="76">Q3</text>
    <rect class="msg" x="474" y="88" width="80" height="28" rx="3"/>
    <rect class="folder" x="574" y="56" width="104" height="74" rx="3"/>
    <text class="s" x="586" y="76">Follow up</text>
    <rect class="msg" x="586" y="88" width="80" height="28" rx="3"/>
  </g>
  <text class="count" x="350" y="156">3 copies written. Multiplier 3.0 for this message.</text>

  <!-- Categories -->
  <text class="h" x="350" y="222">Labels to categories</text>
  <rect class="folder" x="350" y="240" width="328" height="84" rx="3"/>
  <text class="s" x="362" y="260">All Mail, migrated once</text>
  <rect class="msg" x="362" y="272" width="120" height="36" rx="3"/>
  <rect class="tag" x="492" y="278" width="48" height="24" rx="12"/><text class="lbl" x="503" y="295">Bids</text>
  <rect class="tag" x="546" y="278" width="40" height="24" rx="12"/><text class="lbl" x="555" y="295">Q3</text>
  <rect class="tag" x="592" y="278" width="76" height="24" rx="12"/><text class="lbl" x="601" y="295">Follow up</text>
  <text class="count" x="350" y="350">1 copy written. Labels kept as categories.</text>
</svg>
